<!DOCTYPE html>
<html>
<head>
  <title>SmartWaste AI ♻️</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f4f4f4;
      text-align: center;
    }

    h1 {
      background: #2e7d32;
      color: white;
      margin: 0;
      padding: 15px;
    }

    .container {
      padding: 10px;
    }

    video, canvas {
      width: 100%;
      max-width: 400px;
      border-radius: 10px;
    }

    button {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      background: #2e7d32;
      color: white;
      font-size: 14px;
    }

    #result {
      font-size: 22px;
      margin-top: 10px;
      font-weight: bold;
    }

    .card {
      background: white;
      padding: 15px;
      margin-top: 10px;
      border-radius: 10px;
      display: inline-block;
      width: 90%;
      max-width: 400px;
    }

  </style>
</head>

<body>

<h1>♻️ SmartWaste AI</h1>

<div class="container">

  <button onclick="init()">START CAMERA</button>
  <button onclick="switchCamera()">SWITCH CAMERA 📷</button>

  <div id="webcam-container"></div>

  <div class="card">
    <div id="result">Waiting AI...</div>
  </div>

</div>

<script>

const URL = "./";

let model, webcam;
let labelContainer;
let currentFacingMode = "environment";
let lastLabel = "";

// sounds
let recycleSound = new Audio("recycle.mp3");
let notRecycleSound = new Audio("not_recycle.mp3");

async function init() {

  const modelURL = URL + "model.json";
  const metadataURL = URL + "metadata.json";

  model = await tmImage.load(modelURL, metadataURL);

  await setupCamera();

  document.getElementById("webcam-container").appendChild(webcam.canvas);

  loop();
}

// CAMERA SETUP (FULL FIXED BACK CAMERA)
async function setupCamera() {

  webcam = new tmImage.Webcam(400, 400, false);

  await webcam.setup({
    video: {
      facingMode: currentFacingMode
    }
  });

  await webcam.play();
}

// SWITCH CAMERA BUTTON
function switchCamera() {

  currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";

  webcam.stop();
  document.getElementById("webcam-container").innerHTML = "";

  setupCamera().then(() => {
    document.getElementById("webcam-container").appendChild(webcam.canvas);
  });
}

// LOOP
function loop() {
  webcam.update();
  predict();
  requestAnimationFrame(loop);
}

// AI PREDICTION
async function predict() {

  const prediction = await model.predict(webcam.canvas);

  let highest = prediction[0];

  for (let i = 1; i < prediction.length; i++) {
    if (prediction[i].probability > highest.probability) {
      highest = prediction[i];
    }
  }

  let percent = (highest.probability * 100).toFixed(2);

  document.getElementById("result").innerHTML =
    "♻️ " + highest.className + " : " + percent + "%";

  // ALERT SOUND ONLY IF CHANGE
  if (highest.className !== lastLabel) {

    if (highest.className.toLowerCase().includes("recycle")) {
      recycleSound.play();
    } else {
      notRecycleSound.play();
    }

    lastLabel = highest.className;
  }
}

</script>

</body>
</html>
